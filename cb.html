<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>الأستاذ الرقمي — إكمال الربط</title>
<style>
html,body{margin:0;height:100%;background:#0c1a16;color:#f4efe0;font-family:system-ui,"Segoe UI",Tahoma,sans-serif}
.w{min-height:100%;display:flex;align-items:center;justify-content:center;padding:20px;box-sizing:border-box}
.c{max-width:420px;width:100%;background:#13271f;border:1px solid #c9a24b55;border-radius:20px;padding:28px 22px;text-align:center}
h1{font-size:22px;margin:8px 0 10px}p{line-height:1.8;margin:6px 0;color:#d9d3c0}
.i{font-size:54px}a.b{display:inline-block;margin-top:14px;background:#c9a24b;color:#1a1405;font-weight:700;text-decoration:none;border-radius:14px;padding:14px 22px}
small{display:block;margin-top:14px;color:#9aa89f;direction:ltr;word-break:break-all}
</style></head><body><div class="w"><div class="c" id="c"><div class="i">⏳</div><h1>جارٍ إكمال الربط…</h1><p>لحظات من فضلك.</p></div></div>
<script>
/* صفحة العودة من Google: تبدّل الرمز برمز الدخول ثم ترسله مشفّراً (AES-GCM) إلى التطبيق عبر Firestore.
   المفتاح لا يُحفظ هنا ولا في الخادم: يأتي في معامل state ويبقى بين التطبيق وهذه الصفحة. */
var CID="862276133932-nhev6akggv33ri2hakf6aeomudrp2tka.apps.googleusercontent.com",SEC="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",PID="digital-teacher-c7db9",KEY="AIzaSyBE8VFj-TMmNbY-vRftqH51QAOZPaEOoBM";
var RU=location.origin+location.pathname;
function u8(t){t=t.replace(/-/g,"+").replace(/_/g,"/");while(t.length%4)t+="=";return Uint8Array.from(atob(t),function(c){return c.charCodeAt(0)})}
function b64(u){var s="";for(var i=0;i<u.length;i++)s+=String.fromCharCode(u[i]);return btoa(s)}
function show(ic,h,p,extra){document.getElementById("c").innerHTML='<div class="i">'+ic+'</div><h1>'+h+'</h1><p>'+p+'</p>'+(extra||"")}
function back(){return '<a class="b" href="intent:#Intent;action=android.intent.action.MAIN;category=android.intent.category.LAUNCHER;package=iq.digitalteacher.app;end">↩ العودة إلى التطبيق</a><p>إن لم يفتح الزر، افتح تطبيق «الأستاذ الرقمي» يدوياً — الربط يكتمل وحده.</p>'}
(async function(){
 try{
  var q=new URLSearchParams(location.search),code=q.get("code"),st=q.get("state")||"";
  if(q.get("error")){show("⚠️","لم يكتمل الإذن","ألغيتَ الموافقة أو رفضتها من Google. ارجع إلى التطبيق وأعد المحاولة.");return}
  var parts=st.split(".");if(!code||parts.length!==2||!/^[a-z0-9]{24}$/.test(parts[0])){show("⚠️","رابط غير صالح","ابدأ الربط من داخل التطبيق.");return}
  var r=await fetch("https://oauth2.googleapis.com/token",{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},body:new URLSearchParams({code:code,client_id:CID,client_secret:SEC,redirect_uri:RU,grant_type:"authorization_code"})});
  var o=await r.json();
  var payload=JSON.stringify(o.access_token?{access_token:o.access_token,refresh_token:o.refresh_token||"",expires_in:o.expires_in||3600}:{error:o.error||"x"});
  var key=await crypto.subtle.importKey("raw",u8(parts[1]),"AES-GCM",false,["encrypt"]),iv=crypto.getRandomValues(new Uint8Array(12));
  var ct=new Uint8Array(await crypto.subtle.encrypt({name:"AES-GCM",iv:iv},key,new TextEncoder().encode(payload)));
  var all=new Uint8Array(12+ct.length);all.set(iv,0);all.set(ct,12);
  var w=await fetch("https://firestore.googleapis.com/v1/projects/"+PID+"/databases/(default)/documents/oauth_sessions?documentId="+parts[0]+"&key="+KEY,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({fields:{d:{stringValue:b64(all)},t:{integerValue:String(Date.now())}}})});
  if(!w.ok)throw new Error("fs"+w.status);
  if(!o.access_token){show("⚠️","تعذّر الربط","رفضت Google الطلب ("+(o.error||"")+"). أعد المحاولة من التطبيق.");return}
  show("✅","تم الربط بنجاح","يمكنك الآن العودة إلى التطبيق.",back());
 }catch(e){show("⚠️","تعذّر إكمال الربط","تحقق من الإنترنت ثم أعد المحاولة من التطبيق.","<small>"+String(e&&e.message||e)+"</small>")}
})();
</script></body></html>
